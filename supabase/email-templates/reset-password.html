<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinição de senha · GTM BlackBox</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Sora, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #111111;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #ffffff"
    >
      <tr>
        <td align="center" style="padding: 48px 24px">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px"
          >
            <tr>
              <td style="padding-bottom: 32px">
                <p
                  style="
                    margin: 0;
                    font-size: 11px;
                    letter-spacing: 0.15em;
                    text-transform: uppercase;
                    color: #585858;
                  "
                >
                  SCIENT · GTM BlackBox
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <h1
                  style="
                    margin: 0;
                    font-size: 28px;
                    font-weight: 300;
                    line-height: 1.2;
                    color: #111111;
                  "
                >
                  Redefinição de senha
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px">
                <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #111111">
                  Clique no botão abaixo para criar uma nova senha. O link expira em 1 hora.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #0030e8;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 14px 28px;
                    font-size: 13px;
                    font-weight: 500;
                    letter-spacing: 0.05em;
                    text-transform: uppercase;
                  "
                >
                  Criar nova senha
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px">
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #585858">
                  Se você não solicitou a redefinição de senha, ignore este e-mail. Sua senha atual
                  permanece a mesma.
                </p>
              </td>
            </tr>
            <tr>
              <td style="border-top: 1px solid #e6e6e6; padding-top: 24px">
                <p
                  style="
                    margin: 0;
                    font-size: 10px;
                    letter-spacing: 0.1em;
                    text-transform: uppercase;
                    color: #585858;
                  "
                >
                  Scientific AI Native GTM
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
